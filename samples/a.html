<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>案A 仕事カード型｜おりーぶ庵 AI-OS</title>
<style>
 :root{--sea:#2e8b57;--ink:#1a1a1a;--line:#e3e8ea;--muted:#6b7a72}
 *{box-sizing:border-box}
 body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
   background:#f2f5f3;color:var(--ink);-webkit-text-size-adjust:100%}
 header{background:var(--sea);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
 header h1{margin:0;font-size:17px;font-weight:800}
 header p{margin:2px 0 0;font-size:12px;opacity:.85}
 .wrap{max-width:900px;margin:0 auto;padding:14px 14px 40px}
 .sec{font-size:13px;font-weight:800;color:var(--sea);margin:18px 2px 8px;letter-spacing:.04em}
 .big{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;
   box-shadow:0 2px 8px rgba(0,0,0,.05)}
 .big .num{font-size:40px;font-weight:800;line-height:1;color:var(--sea)}
 .big .lbl{font-size:13px;color:var(--muted);margin-top:4px}
 .todo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;
   margin-bottom:8px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
 .bar{width:5px;align-self:stretch;border-radius:99px;flex:0 0 5px}
 .red{background:#d0503f}.orange{background:#e08a4a}.green{background:#3a9d5d}.gray{background:#b7c0bb}
 .todo .t{font-weight:700;font-size:14.5px}
 .todo .s{font-size:12px;color:var(--muted);margin-top:2px}
 .todo .go{margin-left:auto;font-size:12px;font-weight:700;color:var(--sea);white-space:nowrap}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
 .app{text-align:center;text-decoration:none;color:var(--ink)}
 .ic{width:58px;height:58px;border-radius:15px;margin:0 auto;display:flex;align-items:center;
   justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.14)}
 .ic svg{width:74%;height:74%}
 .app .nm{display:block;margin-top:6px;font-size:11.5px;font-weight:700;line-height:1.25}
 .note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.7}
 @media(min-width:620px){ .ic{width:66px;height:66px} .app .nm{font-size:12.5px} }
</style></head><body>
<header><h1>おりーぶ庵 AI-OS</h1><p>案A　仕事カード型 — 「今日やること」が先、アプリは後</p></header>
<div class="wrap">
  <div class="big">
    <div class="num" id="kpi">—</div>
    <div class="lbl">今日みておきたいこと（期限・未処理）</div>
  </div>
  <div class="sec">やること</div>
  <div id="todo"></div>
  <div class="sec">アプリ</div>
  <div class="grid" id="apps"></div>
  <p class="note">※これは見え方の見本です。数字と項目は仮のものです。<br>
  入力欄（「ここに入力して」）はありません。やることを押すとその画面へ進む形です。</p>
</div>
<script src="icons.js"></script>
<script>
 document.getElementById('kpi').textContent = TODO.filter(x=>x.lv!=='gray').length + '件';
 document.getElementById('todo').innerHTML = TODO.map(x=>`
   <div class="todo"><div class="bar ${x.lv}"></div>
     <div><div class="t">${x.t}</div><div class="s">${x.s}　${x.sub}</div></div>
     <div class="go">ひらく ›</div></div>`).join('');
 document.getElementById('apps').innerHTML = ITEMS.map(i=>`
   <a class="app" href="#"><span class="ic" style="background:${tileBg(i.k)}">${tileSvg(i.k)}</span>
     <span class="nm">${i.n}</span></a>`).join('');
</script></body></html>
