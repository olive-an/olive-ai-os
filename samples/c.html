<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>案C 一覧ファースト型｜おりーぶ庵 AI-OS</title>
<style>
 :root{--sea:#2e8b57;--ink:#1a1a1a;--line:#e3e8ea;--muted:#6b7a72;--side:#1f5c3b}
 *{box-sizing:border-box}
 html,body{height:100%}
 body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
   background:#f4f6f5;color:var(--ink);display:flex;-webkit-text-size-adjust:100%}
 aside{width:230px;background:var(--side);color:#fff;flex:0 0 auto;overflow:auto;padding:14px 0 20px}
 aside h1{margin:0 16px 14px;font-size:15px;font-weight:800}
 aside .g{font-size:10.5px;opacity:.6;margin:14px 16px 5px;letter-spacing:.1em}
 aside a{display:flex;gap:9px;align-items:center;padding:8px 16px;color:#fff;text-decoration:none;font-size:13px}
 aside a:hover,aside a.on{background:rgba(255,255,255,.12)}
 aside .dot{width:22px;height:22px;border-radius:7px;flex:0 0 22px;display:flex;align-items:center;justify-content:center}
 aside .dot svg{width:80%;height:80%}
 main{flex:1 1 auto;overflow:auto;min-width:0}
 .top{background:#fff;border-bottom:1px solid var(--line);padding:11px 16px;display:flex;
   gap:10px;align-items:center;position:sticky;top:0;z-index:4}
 .top input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
 .burger{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;
   padding:7px 10px;font-size:15px;cursor:pointer}
 .inner{padding:16px 16px 40px;max-width:820px}
 h2{font-size:15px;margin:0 0 10px}
 .sub{font-size:12px;color:var(--muted);margin:-6px 0 14px}
 .row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
   margin-bottom:7px;display:flex;gap:11px;align-items:center}
 .bar{width:5px;align-self:stretch;border-radius:99px;flex:0 0 5px}
 .red{background:#d0503f}.orange{background:#e08a4a}.green{background:#3a9d5d}.gray{background:#b7c0bb}
 .row .t{font-weight:700;font-size:14.5px}.row .s{font-size:12px;color:var(--muted);margin-top:2px}
 .row .go{margin-left:auto;font-size:12px;font-weight:700;color:var(--sea);white-space:nowrap}
 .note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:18px}
 @media(max-width:760px){
   aside{position:fixed;left:-240px;top:0;bottom:0;z-index:20;transition:left .22s;box-shadow:0 0 30px rgba(0,0,0,.3)}
   aside.open{left:0}
   .burger{display:block}
   .mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
   .mask.on{display:block}
 }
</style></head><body>
<aside id="side"><h1>おりーぶ庵 AI-OS</h1><div id="menu"></div></aside>
<div class="mask" id="mask"></div>
<main>
  <div class="top">
    <button class="burger" id="burger">☰</button>
    <input placeholder="さがす（例：車検、山田、受給者証）">
  </div>
  <div class="inner">
    <h2>今日みておきたいこと</h2>
    <p class="sub">期限が近いもの・まだ手がついていないものを、上から順に出します。</p>
    <div id="rows"></div>
    <h2 style="margin-top:26px">さいきん使ったもの</h2>
    <div id="recent"></div>
    <p class="note">※見え方の見本です。数字と項目は仮のものです。<br>
    入力欄（「ここに入力して」）はありません。左のメニューか、この一覧から入ります。<br>
    せまい画面では左のメニューは ☰ で開きます。</p>
  </div>
</main>
<script src="icons.js"></script>
<script>
 const groups=[...new Set(ITEMS.map(i=>i.g))];
 document.getElementById('menu').innerHTML = groups.map(g=>`
   <div class="g">${g}</div>` + ITEMS.filter(i=>i.g===g).map(i=>`
   <a href="#"><span class="dot" style="background:${tileBg(i.k)}">${tileSvg(i.k)}</span>${i.n}</a>`).join('')).join('');
 document.getElementById('rows').innerHTML = TODO.map(x=>`
   <div class="row"><div class="bar ${x.lv}"></div>
     <div><div class="t">${x.t}</div><div class="s">${x.s}　${x.sub}</div></div>
     <div class="go">ひらく ›</div></div>`).join('');
 document.getElementById('recent').innerHTML = ['シフト','車両','人事','利用者'].map(k=>{
   const i=ITEMS.find(x=>x.k===k);
   return `<div class="row"><span class="dot" style="background:${tileBg(k)};width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center">${tileSvg(k)}</span>
     <div><div class="t">${i.n}</div><div class="s">${i.d}</div></div><div class="go">ひらく ›</div></div>`;
 }).join('');
 const side=document.getElementById('side'), mask=document.getElementById('mask');
 const tog=o=>{ side.classList.toggle('open',o); mask.classList.toggle('on',o); };
 document.getElementById('burger').onclick=()=>tog(!side.classList.contains('open'));
 mask.onclick=()=>tog(false);
 side.addEventListener('click',e=>{ if(e.target.closest('a')) tog(false); });
</script></body></html>
