<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>案B ホーム画面＋下タブ型｜おりーぶ庵 AI-OS</title>
<style>
 :root{--sea:#2e8b57;--ink:#1a1a1a;--line:#e3e8ea;--muted:#6b7a72}
 *{box-sizing:border-box}
 html,body{height:100%}
 body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
   background:var(--sea);color:var(--ink);display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
 header{color:#fff;padding:12px 16px 8px;flex:0 0 auto}
 header h1{margin:0;font-size:17px;font-weight:800}
 header p{margin:2px 0 0;font-size:11.5px;opacity:.85}
 .search{margin:8px 16px 0;flex:0 0 auto}
 .search input{width:100%;padding:11px 14px;border:0;border-radius:12px;font-size:15px;
   background:rgba(255,255,255,.92)}
 .body{flex:1 1 auto;overflow:auto;padding:12px 16px 20px}
 .page{display:none}.page.on{display:block}
 .gname{color:#fff;font-size:12.5px;font-weight:800;opacity:.9;margin:14px 2px 8px;letter-spacing:.05em}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px}
 @media(min-width:560px){ .grid{grid-template-columns:repeat(6,1fr)} }
 .app{text-align:center;text-decoration:none;color:#fff}
 .ic{width:100%;max-width:62px;aspect-ratio:1;border-radius:16px;margin:0 auto;display:flex;
   align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.22)}
 .ic svg{width:74%;height:74%}
 .app .nm{display:block;margin-top:5px;font-size:10.5px;font-weight:700;line-height:1.2}
 .card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;
   display:flex;gap:11px;align-items:center}
 .bar{width:5px;align-self:stretch;border-radius:99px;flex:0 0 5px}
 .red{background:#d0503f}.orange{background:#e08a4a}.green{background:#3a9d5d}.gray{background:#b7c0bb}
 .card .t{font-weight:700;font-size:14.5px}.card .s{font-size:12px;color:var(--muted);margin-top:2px}
 .card .go{margin-left:auto;font-size:12px;font-weight:700;color:var(--sea)}
 nav{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);
   padding:6px 0 max(6px,env(safe-area-inset-bottom))}
 nav button{flex:1;border:0;background:none;padding:6px 0;font-size:10.5px;font-weight:700;
   color:#92a09a;cursor:pointer;line-height:1.5}
 nav button.on{color:var(--sea)}
 nav .e{display:block;font-size:19px}
 .note{color:#fff;opacity:.85;font-size:11px;line-height:1.7;margin-top:16px}
</style></head><body>
<header><h1>おりーぶ庵 AI-OS</h1><p>案B　ホーム画面＋下タブ型 — iPhoneのアプリに近い形</p></header>
<div class="search"><input placeholder="🔍 さがす（例：車検、山田、受給者証）"></div>
<div class="body">
  <div class="page on" id="p-home"></div>
  <div class="page" id="p-kigen"></div>
  <div class="page" id="p-doc"><div class="card"><div class="bar green"></div>
    <div><div class="t">書類棚</div><div class="s">保管した書類をさがす</div></div><div class="go">ひらく ›</div></div>
    <div class="card"><div class="bar green"></div>
    <div><div class="t">会議室・議事録</div><div class="s">議事録の保管・全文検索・要約</div></div><div class="go">ひらく ›</div></div></div>
  <div class="page" id="p-set"><div class="card"><div class="bar gray"></div>
    <div><div class="t">共有フォルダ</div><div class="s">\\192.168.10.100\kyoutsu\AI作成</div></div></div>
    <div class="card"><div class="bar gray"></div>
    <div><div class="t">合言葉</div><div class="s">人事AI・利用者AI</div></div></div></div>
</div>
<nav>
  <button class="on" data-p="home"><span class="e">🏠</span>ホーム</button>
  <button data-p="kigen"><span class="e">⏰</span>期限</button>
  <button data-p="doc"><span class="e">📄</span>書類</button>
  <button data-p="set"><span class="e">⚙️</span>設定</button>
</nav>
<script src="icons.js"></script>
<script>
 const groups=[...new Set(ITEMS.map(i=>i.g))];
 document.getElementById('p-home').innerHTML = groups.map(g=>`
   <div class="gname">${g}</div>
   <div class="grid">${ITEMS.filter(i=>i.g===g).map(i=>`
     <a class="app" href="#"><span class="ic" style="background:${tileBg(i.k)}">${tileSvg(i.k)}</span>
       <span class="nm">${i.n}</span></a>`).join('')}</div>`).join('')
   + `<p class="note">※見え方の見本です。入力欄はありません。<br>下のタブで「期限」「書類」へ切り替えます。</p>`;
 document.getElementById('p-kigen').innerHTML = TODO.map(x=>`
   <div class="card"><div class="bar ${x.lv}"></div>
     <div><div class="t">${x.t}</div><div class="s">${x.s}　${x.sub}</div></div>
     <div class="go">ひらく ›</div></div>`).join('');
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
   document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
   document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.p));
   document.querySelector('.body').scrollTop=0;
 });
</script></body></html>
