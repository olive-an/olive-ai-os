name: Deploy to GitHub Pages

# main へ push すると GitHub Pages へ自動公開します。
# 公開先: https://olive-an.github.io/olive-ai-os/
# （Netlify https://olive-ai-os.netlify.app/ と並行運用。どちらも同じ内容）

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pages を構成（未有効なら自動で有効化）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: サイト一式をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
