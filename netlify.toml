# Netlify設定：ビルド不要の静的サイト（リポジトリ直下を公開）
[build]
  publish = "."

# トップURLを ai-os.html へ（https://olive-ai-os.netlify.app/ だけで開けるように）
[[redirects]]
  from = "/"
  to = "/ai-os.html"
  status = 302

# 画面(HTML)は毎回サーバーに確認する＝iPad・携帯で古い画面が残らないように
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
